<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
</head>

<body>
    <div>
        <h2 class="title manrope-600">Medicare HMS</h2>
    </div>
    <nav class="navbar navbar-expand-xl navbar-light bg-light manrope-400">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarBasic"
                aria-controls="navbarBasic" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse show" id="navbarBasic">
                <ul class="navbar-nav me-auto mb-2 mb-xl-0">
                    <div class="me-3 bd-highlight d-inline-block"></div>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Appointments</a>
                    </li>
                    <div class="me-3 bd-highlight d-inline-block"></div>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Queue</a>
                    </li>
                    <div class="me-3 bd-highlight d-inline-block"></div>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Medical History</a>
                    </li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"
                        autofill-information="overall">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                <div class="dropdown ms-3">
                    <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        John
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <li><a class="dropdown-item" href="#">Profile</a></li>
                        <li><a class="dropdown-item" href="#">Settings</a></li>
                        <li><a class="dropdown-item" href="#">Logout</a></li>
                    </ul>
                </div>
                <div class="me-3 bd-highlight d-inline-block"></div>
            </div>
        </div>
    </nav>
    <div class="card-container">
        <div class="card appointment">
            <div class="card-header">
                Appointments
            </div>
            <div class="card-body">
                <h5 class="card-title">Your next appointment is on...</h5>
                <p class="card-text">29th February</p>
                <a href="#" class="btn btn-primary aq-button">Click to view details</a>
            </div>
        </div>
        <div class="card queue">
            <div class="card-header">
                Queue
            </div>
            <div class="card-body">
                <h5 class="card-title">Current Queue Status:</h5>
                <p class="card-text">67</p>
                <a href="#" class="btn btn-primary aq-button">View Queue</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
